name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Publish the APK as a GitHub release with this tag (leave empty to only upload an artifact)
        type: string
        default: ''
  push:
    branches:
      - main
      - 'ccr-*'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

env:
  HAXE_VERSION: 4.3.7
  NDK_VERSION: 29.0.13113456
  HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp-cache

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium /opt/hostedtoolcache/CodeQL /usr/local/julia* \
            /opt/microsoft /opt/google /usr/lib/jvm/temurin-8* /usr/lib/jvm/temurin-11*
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Haxe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwayland-bin wayland-protocols libwayland-dev libx11-dev libxi-dev libxext-dev \
            libxinerama-dev libxrandr-dev libgl-dev libgl1-mesa-dev libasound2-dev libpulse-dev libxkbcommon-dev \
            libegl-dev libdecor-0-dev libxcursor-dev libxss-dev libxfixes-dev libdbus-1-dev \
            libudev-dev libdrm-dev libgbm-dev libxtst-dev libusb-1.0-0-dev libibus-1.0-dev \
            libpipewire-0.3-dev libsndio-dev libjack-dev
          mkdir -p "$RUNNER_TEMP/haxe"
          curl -fsSL "https://github.com/HaxeFoundation/haxe/releases/download/$HAXE_VERSION/haxe-$HAXE_VERSION-linux64.tar.gz" | tar xz -C "$RUNNER_TEMP/haxe" --strip-components=1
          curl -fsSL "https://github.com/HaxeFoundation/neko/releases/download/v2-4-0/neko-2.4.0-linux64.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/haxe" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/neko-2.4.0-linux64" >> "$GITHUB_PATH"
          echo "HAXE_STD_PATH=$RUNNER_TEMP/haxe/std" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/neko-2.4.0-linux64" >> "$GITHUB_ENV"
          echo "HAXELIB_PATH=$GITHUB_WORKSPACE/.haxelib" >> "$GITHUB_ENV"

      - name: Restore Haxe libraries
        id: cache-haxelib
        uses: actions/cache/restore@v4
        with:
          path: .haxelib
          key: haxelib-v1-${{ hashFiles('hmm.json', 'scripts/mobile/install_haxelibs.py') }}

      - name: Install Haxe libraries
        if: steps.cache-haxelib.outputs.cache-hit != 'true'
        timeout-minutes: 60
        run: |
          python3 scripts/mobile/install_haxelibs.py
          (cd .haxelib/hxcpp/git/tools/hxcpp && haxe compile.hxml)
          # Lime from git ships no binaries; borrow the release lime.ndll so its tools can run,
          # then rebuild it from the fork (the tools need the fork's extra primitives).
          curl -fsSL -o "$RUNNER_TEMP/lime.zip" https://haxelib-files.haxe.org/files/3.0/lime-8,2,2.zip
          unzip -q -o "$RUNNER_TEMP/lime.zip" 'ndll/Linux64/lime.ndll' -d "$RUNNER_TEMP/lime"
          mkdir -p .haxelib/lime/git/ndll/Linux64
          cp "$RUNNER_TEMP/lime/ndll/Linux64/lime.ndll" .haxelib/lime/git/ndll/Linux64/
          haxelib run lime rebuild cpp -64 -release -nocffi < /dev/null

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0" "platforms;android-35" "platforms;android-29" "ndk;$NDK_VERSION" > /dev/null
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME" < /dev/null
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_HOME/ndk/$NDK_VERSION" < /dev/null
          haxelib run lime config JAVA_HOME "$JAVA_HOME" < /dev/null
          haxelib run lime config ANDROID_SETUP true < /dev/null

      - name: Build Lime for Android
        if: steps.cache-haxelib.outputs.cache-hit != 'true'
        timeout-minutes: 60
        run: haxelib run lime rebuild android -release -arm64 -armv7 -nocffi < /dev/null

      - name: Save Haxe libraries
        if: steps.cache-haxelib.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .haxelib
          key: ${{ steps.cache-haxelib.outputs.cache-primary-key }}

      - name: Restore hxcpp compile cache
        uses: actions/cache/restore@v4
        with:
          path: .hxcpp-cache
          key: hxcpp-android-v1-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: hxcpp-android-v1-

      - name: Build APK
        timeout-minutes: 240
        run: |
          mkdir -p "$HXCPP_COMPILE_CACHE"
          bash scripts/mobile/build_android.sh < /dev/null
          df -h /

      - name: Save hxcpp compile cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .hxcpp-cache
          key: hxcpp-android-v1-${{ github.sha }}-${{ github.run_attempt }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VS-Hex-V3-android
          path: export/out/VS-Hex-V3.apk
          compression-level: 0
          retention-days: 14

      - name: Publish release
        if: github.event.inputs.release-tag != '' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release-tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: VS Hex V3 for Android ${{ github.event.inputs.release-tag || github.ref_name }}
          body_path: mobile/RELEASE_NOTES.md
          files: export/out/VS-Hex-V3.apk
          fail_on_unmatched_files: true
